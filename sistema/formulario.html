.<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="arial">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100%;
    background-color: #f2f2f2;
    font-family: Arial,
}

header {
    width: 100%;
    height: 150px;
    background-color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin-bottom: 40px;
}

.moldura {
    width: 120px;
    margin: 0;
}

.texto1 {
    font-size: 30px;
    margin: 0;
}

main {
    width: 100%;
    display: flex;
    justify-content: center;
}


.site {
    width: 900px;
    min-height: 900px;
    background-color: white;
    padding: 30px;
    margin: 0;
}

input,
select {
    background-color: rgb(203, 203, 233);
    padding: 8px;
    border-radius: 5px;
}

textarea {
    width: 100%;
    height: 150px;
}

.linha1,
.linha2,
.linha3,
.linha4,
.linha5,
.linha6,
.linha7,
.linha8,
.linha9 {
    width: 100%;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.linha9 {
    display: block;
}

legend {
    font-size: 20px;
    margin-top: 25px;
    margin-bottom: 20px;
}

    </style>
</head>
<body>
    <header>
        <div>
            <img class="moldura" src="imagem/UniEstrela.png">
        </div>
        <div class="texto1">
             <b>Universidade Nova Estrela - Ficha de Cadastro Aluno</b>
        </div>                                     
    </header>
    <main>
    <div class="site">
            <legend>
                DADOS PESSOAIS
            </legend>

        <div class="linha1">
            <input type="text" placeholder="Nome" minlength="5" maxlength="30" required>
            <select>
                <option>Masculino</option>
                <option>Feminino</option>
                <option>Carro</option>
            </select>
        </div>
        <div class="linha2">
            <input type="date">
            <input type="text" placeholder="CPF" minlength="5" maxlength="30" required>
            <input type="text" placeholder="RG" minlength="5" maxlength="30" required>
            <input type="text" placeholder="Nacionalidade" minlength="5" maxlength="30" required>
        </div>
        <div class="linha3">
            <input type="email" placeholder="Email" minlength="5" maxlength="50" required>
            <input type="number" placeholder="Telefone Celular" minlength="5" maxlength="30" required>
            <input type="number" placeholder="Telefone Residencial" minlength="5" maxlength="30" required>
        </div>
            <legend>
                DADOS DE ENDEREÇO
            </legend>

        <div class="linha4">
            <input type="number" placeholder="CEP" minlength="5" maxlength="30" required>
            <input type="text" placeholder="Logradouro" minlength="5" maxlength="45" required>
            <input type="number" placeholder="Numero" minlength="5" maxlength="30" required>
            <input type="text" placeholder="Complemento" minlength="5" maxlength="30" required>
        </div>
        <div class="linha5">
            <input type="text" placeholder="Bairro" minlength="5" maxlength="30" required>
            <input type="text" placeholder="Cidade" minlength="5" maxlength="30" required>
            <select>
                <option>SP</option>
                <option>MG</option>
                <option>RJ</option>
                <option>MS</option>
                <option>MT</option>
                <option>SC</option>
                <option>RS</option>
                <option>PR</option>
            </select>
        </div>
            <legend>
                DADOS ACADÊMICOS
            </legend>

        <div class="linha6">
            <input type="text" placeholder="Curso" minlength="5" maxlength="30" required>
            <input type="int" placeholder="Matricula" minlength="5" maxlength="30" required>
            <input type="text" placeholder="Ano/Semestre" minlength="5" maxlength="30" required>
        </div>
        <div class="linha7">
            <select>
                <option>Presencial</option>
                <option>Semi-presencial</option>
                <option>Home-office</option>
            </select>
            <select>
                <option>Manhã</option>
                <option>Tarde</option>
                <option>Noite</option>
            </select>
            <input type="text" placeholder="Escolaridade" minlength="5" maxlength="60" required>
        </div>
            <LEGend>
                DADOS DO RESPONSÁVEL
            </LEGend>

        <div class="linha8">
            <input type="text" placeholder="Nome do responsável" minlength="5" maxlength="30" required>
            <input type="number" placeholder="CPF do responsável" minlength="5" maxlength="30" required>
        </div>
        <div class="linha9">
            Observações:
            <textarea></textarea>
        </div>
    </div>
    </main>
    <footer></footer>
</body>
</html>
